<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./nova-icon.svg">
<title>NOVA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07070A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Arial,sans-serif}button,input,textarea{font:inherit}button{border:0}.app{min-height:100dvh;max-width:720px;margin:auto;padding-bottom:92px}.screen{padding:20px;padding-top:max(20px,env(safe-area-inset-top))}.brand{font-size:32px;font-weight:950;letter-spacing:5px}.muted{color:#8a8a94;line-height:1.45}.tiny{color:#666;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#18181d;border:1px solid #292930;font-weight:850}.eyebrow{font-size:10px;color:#777;letter-spacing:2px;font-weight:900}.title{font-size:30px;font-weight:850;letter-spacing:-1px;margin-top:3px}.accent{color:#a78bfa}.hero{position:relative;overflow:hidden;background:#111116;border:1px solid #27272f;border-radius:26px;padding:22px;margin-bottom:26px}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#4c1d95;opacity:.22;right:-55px;top:-70px}.hero>*{position:relative;z-index:1}.tag{color:#a78bfa;font-size:10px;font-weight:900;letter-spacing:2px}.hero h1{font-size:26px;line-height:1.12;margin:10px 0 8px;letter-spacing:-.8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#09090b;border-radius:14px;padding:12px 16px;font-weight:850;cursor:pointer;margin-top:16px}.btn.dark{background:#17171d;color:#fff;border:1px solid #292932}.btn.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#111116;border:1px solid #24242b;border-radius:18px;padding:16px;margin-bottom:10px}.module{min-height:145px;cursor:pointer;transition:.15s}.module:active,.card:active{transform:scale(.985);opacity:.84}.icon{width:39px;height:39px;border-radius:12px;background:#1b1b23;display:grid;place-items:center;margin-bottom:13px;font-size:19px}.module h3,.tool h3{margin:0;font-size:15px}.module p,.tool p{margin:5px 0 0;color:#777781;font-size:12px;line-height:1.4}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.section h2{font-size:18px;margin:0}.tool{display:flex;align-items:center;gap:12px}.tool .icon{margin:0}.tool .grow{flex:1}.input,.textarea{width:100%;background:#09090d;color:#fff;border:1px solid #27272f;border-radius:14px;padding:14px;outline:none;margin-top:10px}.textarea{min-height:105px;resize:vertical}.input:focus,.textarea:focus{border-color:#6d5aa5}.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}.authbox{width:min(460px,100%)}.authbox .brand{margin-bottom:25px}.authbox h1{font-size:31px;margin:0 0 6px}.authbox .card{padding:20px;margin-top:22px}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:82px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:rgba(12,12,16,.96);backdrop-filter:blur(20px);border-top:1px solid #202027;display:flex;justify-content:space-around}.nav button{background:none;color:#666;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.nav button.active{color:#fff}.nav b{font-size:19px}.nav span{font-size:9px;font-weight:750}.modal{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#111116;border:1px solid #2a2a32;border-radius:25px;padding:22px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.sheet h2{margin:0 0 8px}.steps{margin:18px 0;padding:0;list-style:none}.steps li{padding:12px 0;border-bottom:1px solid #24242b;color:#bbb}.steps b{color:#fff}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#09090b;border-radius:13px;padding:11px 15px;font-weight:750;display:none}.toast.show{display:block}.hide{display:none!important}
@media(max-width:430px){.grid{gap:8px}.screen{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="installModal" class="modal"><div class="sheet"><div class="tag">INSTALL NOVA</div><h2>Put NOVA on your Home Screen</h2><p class="muted" id="installText">For the full app-like experience, add NOVA to your Home Screen.</p><ol class="steps" id="installSteps"><li><b>1.</b> Tap the Safari Share button.</li><li><b>2.</b> Choose <b>Add to Home Screen</b>.</li><li><b>3.</b> Tap <b>Add</b>, then open NOVA from your Home Screen.</li></ol><button class="btn full" onclick="closeInstall()">Got it</button></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qumindqmcvsoxivitker.supabase.co";
const SUPABASE_KEY="sb_publishable_Ck9vpsB7hs5VW7Hs-6uUDQ_5DV1nSSy";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const APP_URL="https://buzzbrawlst.github.io/mobile-app-/";
let session=null,profile=null,tab="home";
const modules=[["AI","✦","Ask, build, brainstorm and automate.","ai"],["Games","◉","Play, compete and discover.","games"],["Social","◎","Friends, communities and messages.","social"],["Create","＋","Make sites, music, art and more.","create"],["Market","◇","Discover products and digital drops.","market"],["Mystery","⌁","Hidden layers, puzzles and events.","mystery"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(x){const e=document.getElementById("toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400)}
function isStandalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function closeInstall(){document.getElementById("installModal").classList.remove("show");localStorage.setItem("nova-install-seen","1")}
function maybeInstall(){if(!isStandalone()&&!localStorage.getItem("nova-install-seen"))setTimeout(()=>document.getElementById("installModal").classList.add("show"),700)}
function initials(){return esc((profile?.display_name||profile?.username||"N").slice(0,1).toUpperCase())}
async function loadProfile(){if(!session)return;const r=await sb.from("profiles").select("*").eq("id",session.user.id).single();profile=r.data||null}
function nav(){return `<nav class="nav">${[["home","⌂","Home"],["ai","✦","AI"],["games","◉","Games"],["social","◎","Social"],["create","＋","Create"]].map(x=>`<button class="${tab===x[0]?"active":""}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join("")}<button onclick="settings()"><b>⚙</b><span>Settings</span></button></nav>`}
function home(){return `<div class="screen"><div class="top"><div><div class="eyebrow">NOVA / 01</div><div class="title">Hey, <span class="accent">${esc(profile?.display_name||profile?.username||"creator")}.</span></div></div><div class="avatar">${initials()}</div></div><div class="hero"><div class="tag">THE DIGITAL ECOSYSTEM</div><h1>Everything you want to do, connected.</h1><p class="muted">AI, games, social, creativity and hidden worlds — built into one pocket universe.</p><button class="btn" onclick="go('ai')">✦ Open NOVA AI</button></div><div class="section"><h2>Explore</h2><span class="tiny">6 modules</span></div><div class="grid">${modules.map(m=>`<div class="card module" onclick="go('${m[3]}')"><div class="icon">${m[1]}</div><h3>${m[0]}</h3><p>${m[2]}</p></div>`).join("")}</div><div class="section"><h2>Live now</h2><span class="tiny">03</span></div><div class="card"><div class="tag">● LIVE EVENT</div><h2>The first signal</h2><p class="muted">A strange message appeared in the NOVA network.</p><button class="btn dark" onclick="toast('Investigation opened')">Investigate →</button></div></div>${nav()}`}
function ai(){return `<div class="screen"><div class="eyebrow">NOVA / AI</div><h1>NOVA AI</h1><p class="muted">Your assistant, creator and command centre.</p><div class="hero" style="margin-top:20px"><div class="icon">✦</div><h2>What are we making?</h2><p class="muted">Save prompts to your NOVA workspace.</p><textarea id="aiPrompt" class="textarea" placeholder="Try “make me a game idea”"></textarea><button class="btn" onclick="savePrompt()">Save prompt →</button></div><div class="section"><h2>Tools</h2></div>${["Chat","Image studio","Code builder","Music lab","Agents"].map((x,i)=>`<div class="card tool"><div class="icon">${["◌","▧","⌘","♫","ϟ"][i]}</div><div class="grow"><h3>${x}</h3><p>Ready to use</p></div><span>›</span></div>`).join("")}</div>${nav()}`}
async function savePrompt(){const q=document.getElementById("aiPrompt").value.trim();if(!q)return;const r=await sb.from("projects").insert({user_id:session.user.id,name:q,kind:"ai_prompt",data:{prompt:q}});if(r.error)toast(r.error.message);else{document.getElementById("aiPrompt").value="";toast("Prompt saved to NOVA projects")}}
async function games(){return `<div class="screen"><div class="eyebrow">NOVA / PLAY</div><h1>Games</h1><p class="muted">Play, compete and discover.</p><div class="hero" style="margin-top:20px"><div class="tag">FEATURED</div><h1>NOVA ARENA</h1><p class="muted">Fast browser games. Global leaderboards. Daily challenges.</p><button class="btn" onclick="score('NOVA Arena')">Record score</button></div><div class="section"><h2>Your games</h2></div>${["RIFT","Signal Rush","Pixel Panic"].map((x,i)=>`<div class="card tool" onclick="score('${x}')"><div class="icon">${["⚡","◉","✦"][i]}</div><div class="grow"><h3>${x}</h3><p>${i===0?"2v2 build + fight":"Arcade • multiplayer"}</p></div><span class="tag">PLAY</span></div>`).join("")}</div>${nav()}`}
async function score(game){const r=await sb.from("game_scores").insert({user_id:session.user.id,game,score:Math.floor(Math.random()*9000)+1000});toast(r.error?r.error.message:"Score saved to the leaderboard")}
async function social(){const r=await sb.from("posts").select("id,content,created_at,user_id").order("created_at",{ascending:false}).limit(30);const posts=r.data||[];return `<div class="screen"><div class="eyebrow">NOVA / SOCIAL</div><h1>Social</h1><p class="muted">Your people, your spaces.</p><div class="card" style="margin-top:20px"><div class="tool"><div class="avatar">${initials()}</div><div class="grow"><h3>${esc(profile?.display_name||profile?.username||"NOVA user")}</h3><p>Connected to Supabase</p></div></div></div><div class="card"><textarea id="postText" class="textarea" placeholder="Share something with NOVA..."></textarea><button class="btn" onclick="post()">Post</button></div><div class="section"><h2>Community feed</h2></div>${posts.length?posts.map(p=>`<div class="card"><div class="tag">NOVA USER</div><p style="margin-bottom:0;line-height:1.5">${esc(p.content)}</p></div>`).join(""):'<p class="muted">No posts yet. Be the first.</p>'}</div>${nav()}`}
async function post(){const t=document.getElementById("postText").value.trim();if(!t)return;const r=await sb.from("posts").insert({user_id:session.user.id,content:t});if(r.error)toast(r.error.message);else{toast("Posted");render()}}
function create(){return `<div class="screen"><div class="eyebrow">NOVA / CREATE</div><h1>Create</h1><p class="muted">Turn ideas into things people can use.</p><div class="grid" style="margin-top:20px">${["Website","Graphic","Music","Avatar","Video","Game"].map((x,i)=>`<div class="card module" onclick="createProject('${x}')"><div class="icon">${["◫","✎","♫","●","▶","◉"][i]}</div><h3>${x}</h3><p>Create a saved NOVA project.</p></div>`).join("")}</div></div>${nav()}`}
async function createProject(kind){const r=await sb.from("projects").insert({user_id:session.user.id,name:"Untitled "+kind,kind:kind.toLowerCase(),data:{}});toast(r.error?r.error.message:kind+" project saved")}
function settings(){document.getElementById("root").innerHTML=`<div class="screen"><div class="eyebrow">NOVA / SETTINGS</div><h1>Settings</h1><p class="muted">Make NOVA yours.</p><div class="card tool" style="margin-top:20px"><div class="grow"><h3>Installed app</h3><p>Use NOVA from your Home Screen like an app.</p></div><button class="btn dark" style="margin:0" onclick="document.getElementById('installModal').classList.add('show')">How</button></div><div class="card tool"><div class="grow"><h3>Account</h3><p>${esc(session.user.email)}</p></div></div><button class="btn dark full" onclick="sb.auth.signOut()">Sign out</button><button class="btn full" onclick="go('home')">Back to NOVA</button></div>`}
function auth(){document.getElementById("root").innerHTML=`<div class="auth"><div class="authbox"><div class="brand">NOVA</div><h1>Welcome back.</h1><p class="muted">Your world. One app.</p><div class="card"><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn full" onclick="signIn()">Sign in</button><button class="btn dark full" onclick="signUp()">Create account</button></div></div></div>`}
async function signIn(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)toast(r.error.message);else{session=r.data.session;await loadProfile();render()}}
async function signUp(){const r=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:APP_URL}});if(r.error)toast(r.error.message);else toast(r.data.session?"Account created":"Check your email to confirm your account")}
async function go(x){tab=x;if(["market","mystery"].includes(x)){toast(x[0].toUpperCase()+x.slice(1)+" is coming soon");return}render()}
async function render(){if(!session){auth();return}let html=tab==="home"?home():tab==="ai"?ai():tab==="games"?await games():tab==="social"?await social():create();document.getElementById("root").innerHTML=html}
(async()=>{const r=await sb.auth.getSession();session=r.data.session;if(session)await loadProfile();render();if(session)maybeInstall();sb.auth.onAuthStateChange(async(e,s)=>{session=s;if(s){await loadProfile();render()}else{session=null;profile=null;render()}});const ch=sb.channel("nova-posts-web").on("postgres_changes",{event:"*",schema:"public",table:"posts"},()=>{if(tab==="social")render()}).subscribe()})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
